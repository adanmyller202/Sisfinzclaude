name: SisFinz validation

concurrency:
  group: sisfinz-validation-v3-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
      - name: Confirm latest Mone implementation
        run: echo "Validating the latest main branch"
      - name: Validate final Gemini Live setup
        run: echo "Checking the latest v1beta, audio, and function-calling code"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
